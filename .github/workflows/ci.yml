name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      benchmark_messages:
        description: Broker work units per trial (1–128)
        type: number
        default: 8
      benchmark_trials:
        description: Measured trials after one warmup (2–12)
        type: number
        default: 3
      benchmark_workers:
        description: Concurrent independent peer pairs (1–16)
        type: number
        default: 4
      benchmark_base:
        description: Optional complete baseline commit SHA for a same-runner comparison
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff, ShellCheck, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned lint tools
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          config = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          dependencies = config['project']['optional-dependencies']['lint']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
          ruff --version
          shellcheck --version
          actionlint --version
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Ruff security rules are enforced
        run: python scripts/ci/lint_checks.py
      - name: ShellCheck tracked shell scripts
        run: git ls-files -z -- '*.sh' '*.bash' | xargs -0 --no-run-if-empty shellcheck
      - name: actionlint with ShellCheck on workflow run steps
        run: actionlint -shellcheck "$(command -v shellcheck)"
  contracts:
    name: Contracts and package (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select complete change checks
        id: selection
        run: python scripts/ci/select_checks.py --selection-file "$RUNNER_TEMP/xordination-selection.json"
      - uses: actions/setup-python@v7
        if: steps.selection.outputs.contracts == 'true' || (matrix.python == '3.12' && (steps.selection.outputs.package == 'true' || steps.selection.outputs.image == 'true'))
        with:
          python-version: ${{ matrix.python }}
          cache: ${{ matrix.python == '3.12' && (steps.selection.outputs.contracts == 'true' || steps.selection.outputs.package == 'true') && 'pip' || '' }}
          cache-dependency-path: pyproject.toml
      - name: Install canonical build and measurement tools
        if: matrix.python == '3.12' && (steps.selection.outputs.contracts == 'true' || steps.selection.outputs.package == 'true')
        env:
          XORDINATION_CONTRACTS: ${{ steps.selection.outputs.contracts }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys, tomllib
          config = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          dependencies = config['build-system']['requires']
          if os.environ['XORDINATION_CONTRACTS'] == 'true':
              dependencies += config['project']['optional-dependencies']['ci']
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
      - name: Compile selected contract context
        if: steps.selection.outputs.contracts == 'true'
        run: python -m compileall -q src tests scripts/ci scripts/testing
      - name: Selected contracts and canonical coverage
        if: matrix.python == '3.12' && steps.selection.outputs.contracts == 'true'
        env:
          PYTHONPATH: src
        run: python scripts/ci/coverage_baseline.py --selection "$RUNNER_TEMP/xordination-selection.json" --output "$RUNNER_TEMP/xordination-coverage"
      - name: Selected contracts
        if: matrix.python != '3.12' && steps.selection.outputs.contracts == 'true'
        env:
          PYTHONPATH: src
        run: |
          python scripts/ci/run_contracts.py --selection "$RUNNER_TEMP/xordination-selection.json" --report "$RUNNER_TEMP/xordination-test-execution.json"
          python -m xordination --version
          python -m xordination --help
      - name: Broker performance evidence (base and head, report-only timing)
        id: benchmark
        if: matrix.python == '3.12' && steps.selection.outputs.benchmark == 'true'
        run: python scripts/ci/benchmark_compare.py --output "$RUNNER_TEMP/xordination-performance"
      - name: Source archive to isolated installed package
        if: matrix.python == '3.12' && steps.selection.outputs.package == 'true'
        run: python scripts/ci/check_package.py
      - name: Build and exercise durable nonroot broker image
        if: matrix.python == '3.12' && steps.selection.outputs.image == 'true'
        run: |
          docker build --tag xordination-ci .
          python scripts/ci/image_smoke.py --image xordination-ci
      - name: Preserve selected coverage evidence
        if: always() && matrix.python == '3.12' && steps.selection.outputs.contracts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-3.12
          path: ${{ runner.temp }}/xordination-coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve performance evidence
        if: always() && matrix.python == '3.12' && steps.selection.outputs.benchmark == 'true' && steps.benchmark.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: performance-python-3.12
          path: ${{ runner.temp }}/xordination-performance/
          if-no-files-found: error
          retention-days: 14
      - name: Report selected checks
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          selection = pathlib.Path(os.environ['RUNNER_TEMP']) / 'xordination-selection.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              if selection.is_file():
                  report.write('Selected checks:\n\n```json\n' + json.dumps(json.loads(selection.read_text()), indent=2) + '\n```\n')
              else:
                  report.write('Selection failed before publishing a result; this job cannot authorize a skip.\n')
              for name, filename in (
                  ('Contract execution census', 'xordination-test-execution.json'),
                  ('Canonical contract execution census', 'xordination-coverage/test-execution.json'),
                  ('Performance context', 'xordination-performance/ci-context.json'),
                  ('Performance comparison', 'xordination-performance/comparison.json'),
              ):
                  evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / filename
                  if evidence.is_file():
                      report.write('\n' + name + ':\n\n```json\n' + json.dumps(json.loads(evidence.read_text()), indent=2) + '\n```\n')
          PY
